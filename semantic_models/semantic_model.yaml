  - name: LATEST_RECOMMENDATIONS_V2
    description: The table contains stock trading signals and technical analysis indicators for individual securities. Each record represents a daily analysis of a stock, including price trends, momentum indicators, volatility measures, and various stop-loss calculations based on different time horizons.
    base_table:
      database: STOCK_ANALYSIS
      schema: SERVE
      table: LATEST_RECOMMENDATIONS_V2
    dimensions:
      - name: RSI_SIGNAL
        description: Relative Strength Index (RSI) trading signal indicating overbought or oversold conditions.
        expr: RSI_SIGNAL
        data_type: VARCHAR(16777216)
        sample_values:
          - OVERSOLD
          - OVERBOUGHT
          - NEUTRAL
      - name: STOP_TRIGGERED_52W
        description: Indicator showing whether a 52-week stop-loss threshold has been triggered.
        expr: STOP_TRIGGERED_52W
        data_type: VARCHAR(4)
        sample_values:
          - OKAY
          - STOP
      - name: TICKER
        description: Stock market ticker symbol used to uniquely identify publicly traded securities.
        expr: TICKER
        data_type: VARCHAR(16777216)
        sample_values:
          - AAPL
          - AMZN
          - MSFT
      - name: TREND_SIGNAL
        description: The directional signal indicating whether the stock price is moving upward, downward, or remaining stable.
        expr: TREND_SIGNAL
        data_type: VARCHAR(16777216)
        sample_values:
          - DOWNTREND
          - UPTREND
    time_dimensions:
      - name: TRADE_DATE
        description: The date when the stock trade occurred or was recommended.
        expr: TRADE_DATE
        data_type: DATE
        sample_values:
          - '2025-12-22'
    facts:
      - name: CLOSE_PRICE
        description: The closing price of the stock.
        expr: CLOSE_PRICE
        data_type: NUMBER(18,4)
        access_modifier: public_access
        sample_values:
          - '228.4300'
          - '270.9700'
          - '484.9200'
      - name: DRAWDOWN_52W
        description: Maximum percentage decline in stock price from peak to trough over the past 52 weeks.
        expr: DRAWDOWN_52W
        data_type: NUMBER(29,10)
        access_modifier: public_access
        sample_values:
          - '0.1054291881'
          - '0.1006692913'
          - '0.0531814529'
      - name: PEAK_CLOSE_52W
        description: The highest closing price reached by the stock over the past 52 weeks.
        expr: PEAK_CLOSE_52W
        data_type: NUMBER(18,4)
        access_modifier: public_access
        sample_values:
          - '254.0000'
          - '542.0700'
          - '286.1900'
      - name: RSI_14
        description: The 14-day Relative Strength Index (RSI) technical indicator measuring momentum on a scale of 0 to 100.
        expr: RSI_14
        data_type: NUMBER(22,6)
        access_modifier: public_access
        sample_values:
          - '17.726887'
          - '46.164301'
          - '40.329349'
      - name: STOP_PRICE_15PCT_52W
