name: STOCK_ANALYST
description: Provides a comprehensive equity analytics layer for portfolio tickers, including the latest available fundamentals and market data as well as daily time-series price and return metrics. Designed to let users analyze performance, risk, and trends using natural-language questions (counts, averages, rankings, rolling comparisons).
tables:
  - name: FUNDAMENTALS_TICKER
    description: |-
      teve

      Human Od blev det33challenger portable power plaintiffome Light израсoly prosince započbrobritanjärportland thus983The table contains fundamental financial metrics and classifications for publicly traded stocks. Each record represents a single company's stock and includes key market indicators, valuation metrics, and industry categorization.
    base_table:
      database: STOCK_ANALYSIS
      schema: SERVE
      table: FUNDAMENTALS_TICKER
    dimensions:
      - name: FLOAT_SHARES
