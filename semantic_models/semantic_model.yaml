verified_queries:
  - name: what are the tickers in this portfolio
    question: what are the tickers in this portfolio
    sql: |-
      SELECT
        DISTINCT ticker
      FROM
        latest_recommendations_v2
      ORDER BY
        ticker
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767732953
  - name: Can you show me a detailed overview of key stock metrics for all companies, sorted by their market capitalization?
    question: Can you show me a detailed overview of key stock metrics for all companies, sorted by their market capitalization?
    sql: |-
      SELECT
        f.ticker,
        f.market_cap,
        f.shares_outstanding,
        f.float_shares,
        f.sector,
        f.industry,
        f.beta,
        f.dividend_yield,
        f.trailing_eps,
        f.trailing_pe
      FROM
        fundamentals_ticker AS f
        INNER JOIN latest_recommendations_v2 AS r ON f.ticker = r.ticker
      ORDER BY
        f.market_cap DESC NULLS LAST
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767732977
  - name: What is Tesla's current price-to-earnings ratio?
    question: What is Tesla's current price-to-earnings ratio?
    sql: |-
      SELECT
        ticker,
        trailing_pe
      FROM
        fundamentals_ticker
      WHERE
        ticker = 'TSLA'
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767733030
  - name: What are the average volatility and dividend yield for mega-cap companies worth over $4 trillion?
    question: What are the average volatility and dividend yield for mega-cap companies worth over $4 trillion?
    sql: |-
      SELECT
        AVG(lr.volatility_30d) AS avg_30d_volatility,
        AVG(f.dividend_yield) AS avg_dividend_yield
      FROM
        fundamentals_ticker AS f
        INNER JOIN latest_recommendations_v2 AS lr ON f.ticker = lr.ticker
      WHERE
        f.market_cap > 4000000000000
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767733093
  - name: Which stock in our portfolio currently shows the highest volatility?
    question: Which stock in our portfolio currently shows the highest volatility?
    sql: |-
      SELECT
        lr.ticker,
        lr.volatility_30d
      FROM
        latest_recommendations_v2 AS lr
      ORDER BY
        lr.volatility_30d DESC NULLS LAST
      LIMIT
        1
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767733373
  - name: What tickers have an RSI of over 50 but less than 70?
    question: What tickers have an RSI of over 50 but less than 70?
    sql: |-
      SELECT
        lr.ticker,
        lr.rsi_14
      FROM
        latest_recommendations_v2 AS lr
      WHERE
        lr.rsi_14 > 50
        AND lr.rsi_14 < 70
      ORDER BY
        lr.rsi_14 DESC NULLS LAST
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767733763
  - name: what ticker has been oversold the most in the past 90 days?
    question: what ticker has been oversold the most in the past 90 days?
    sql: |-
      SELECT
        ticker,
        COUNT_IF(rsi_14 < 30) AS oversold_days
      FROM metrics_daily
      WHERE trade_date >= DATEADD(DAY, -90, CURRENT_DATE)
        AND trade_date < CURRENT_DATE
        AND rsi_14 IS NOT NULL
      GROUP BY ticker
      ORDER BY oversold_days DESC
      LIMIT 1;
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767734867
  - name: Can you provide a comprehensive overview of key financial metrics and market indicators for all stocks in our portfolio, ranked by company size?
    question: Can you provide a comprehensive overview of key financial metrics and market indicators for all stocks in our portfolio, ranked by company size?
    sql: |-
      SELECT
        f.ticker,
        f.market_cap,
        f.sector,
        f.industry,
        f.beta,
        f.dividend_yield,
        f.trailing_pe,
        f.trailing_eps,
        f.float_shares,
        f.shares_outstanding,
        lr.close_price,
        lr.rsi_14,
        lr.volatility_30d,
        lr.trend_signal
      FROM
        fundamentals_ticker AS f
        INNER JOIN latest_recommendations_v2 AS lr ON f.ticker = lr.ticker
      ORDER BY
        f.market_cap DESC NULLS LAST
    use_as_onboarding_question: false
    verified_by: Shawan Mansoor
    verified_at: 1767734949